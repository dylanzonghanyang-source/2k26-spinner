name: Deploy to HK Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hk-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_BASE: "/"

      - name: Deploy dist/ to HK server via rsync
        env:
          HK_SSH_KEY: ${{ secrets.HK_SSH_KEY }}
          HK_KNOWN_HOSTS: ${{ secrets.HK_KNOWN_HOSTS }}
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_DEPLOY_PATH: ${{ secrets.HK_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # trailing newline is mandatory for OpenSSH key parsing
          printf '%s\n' "$HK_SSH_KEY" > ~/.ssh/hk_key
          chmod 600 ~/.ssh/hk_key
          printf '%s\n' "$HK_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hk_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes" \
            dist/ root@${HK_HOST}:${HK_DEPLOY_PATH}/
          ssh -i ~/.ssh/hk_key -o StrictHostKeyChecking=yes root@${HK_HOST} \
            "ls ${HK_DEPLOY_PATH}/ | head -5 && du -sh ${HK_DEPLOY_PATH}"
