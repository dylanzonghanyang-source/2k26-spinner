name: Deploy to HK Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hk-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy dist/ to HK server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HK_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HK_HOST }}
          REMOTE_USER: ${{ secrets.HK_USER }}
          REMOTE_PORT: 22
          SOURCE: "dist/"
          TARGET: ${{ secrets.HK_DEPLOY_PATH }}
          ARGS: "-rltgoDzvO --delete"
          EXCLUDE: ""
