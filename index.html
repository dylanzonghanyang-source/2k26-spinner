<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2KSpinner</title>
    <meta
      name="description"
      content="NBA 2K26 王朝模式随机球员生成工具，支持混合能力槽、新秀卡真实数据、随机身体模板和录入清单。"
    />
    <meta name="application-name" content="2KSpinner" />
    <meta name="apple-mobile-web-app-title" content="2KSpinner" />
    <meta name="theme-color" content="#20201d" />
    <script>
      // Set theme before first paint: saved preference wins, otherwise dark by default.
      (function () {
        try {
          var t = localStorage.getItem("2kspinner-theme") || localStorage.getItem("2k26-spinner-theme");
          document.documentElement.dataset.theme = (t === "light" || t === "dark") ? t : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
